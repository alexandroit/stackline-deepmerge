name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      expected_sha512:
        description: SHA-512 hex digest of the tested release tarball
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish with provenance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Require the default branch
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Pin the publishing npm CLI
        run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm test
      - run: npm run test:attw

      - name: Reject an existing public version and unexpected registry errors
        shell: bash
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const { name, version } = require('./package.json');
          const result = spawnSync('npm', ['view', `${name}@${version}`, 'version', '--json', '--registry=https://registry.npmjs.org'], { encoding: 'utf8' });
          if (result.status === 0) throw new Error(`${name}@${version} already exists`);
          let response;
          try { response = JSON.parse(result.stdout); } catch { throw new Error('Registry absence check did not return npm JSON'); }
          if (result.error || result.signal || response.error?.code !== 'E404') {
            process.stderr.write(result.stderr || 'Unexpected npm registry error');
            process.exit(1);
          }
          NODE
      - name: Build immutable package artifact
        shell: bash
        env:
          EXPECTED_SHA512: ${{ inputs.expected_sha512 }}
        run: |
          mkdir artifact
          npm pack --ignore-scripts --pack-destination artifact
          expected="$(printf '%s' "$EXPECTED_SHA512" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          actual_sha512="$(sha512sum artifact/*.tgz | awk '{print $1}')"
          if [[ ! "$expected" =~ ^[0-9a-f]{128}$ ]]; then
            echo "expected_sha512 must contain exactly 128 hexadecimal characters" >&2
            exit 1
          fi
          if [ "$actual_sha512" != "$expected" ]; then
            echo "Tarball digest mismatch: expected $expected, got $actual_sha512" >&2
            exit 1
          fi
          (cd artifact && sha512sum *.tgz > SHA512SUMS)
      - name: Prepare npm OIDC client and SBOM
        run: |
          npm sbom --omit=dev --sbom-format cyclonedx > artifact/sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release
          path: artifact/
          if-no-files-found: error
      - run: npm publish artifact/*.tgz --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org
